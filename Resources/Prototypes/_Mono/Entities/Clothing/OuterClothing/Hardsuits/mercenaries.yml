# SCAF hardsuit
- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitScaf
  name: SCAF hardsuit
  description: A kevlar reinforced combat hardsuit. Old yet sturdy nonetheless. # mono - not green anymore cuh
  components:
  - type: Sprite
    sprite: _NF/Clothing/OuterClothing/Hardsuits/scaf.rsi
  - type: Clothing
    sprite: _NF/Clothing/OuterClothing/Hardsuits/scaf.rsi
  - type: Armor
    modifiers:
      coefficients: # Mono - all of these values are changed
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.45 # Mono
        Heat: 0.55
        Radiation: 0.5 # Added Radiation Resist
        Caustic: 0.65
  - type: ExplosionResistance
    damageCoefficient: 0.35
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ClothingSpeedModifier # Mono - Armor Value Changes
    walkModifier: 0.825
    sprintModifier: 0.825
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head:  ClothingHeadHelmetHardsuitScaf
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: PirateBountyItem # Mono
    id: ClothingOuterHardsuitTacsuitHighValue
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.45

- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitBucketEngi
  name: BC Combat Engineering hardsuit
  description: A engineering hardsuit suited for combat by Bucket Corp.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/combat_engi.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/combat_engi.rsi
  - type: PressureProtection
    highPressureMultiplier: 100
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.45
        Heat: 0.1
        Radiation: 0.2
        Caustic: 0.2
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitEngineeringWhite
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: PirateBountyItem
    id: ClothingOuterHardsuitTacsuit
  - type: StaminaDamageResistance
    coefficient: 0.2
  - type: FireProtection
    reduction: 0.9